<svg xmlns="http://www.w3.org/2000/svg" width="700" height="380" viewBox="0 0 700 380" role="img" aria-label="Veri, enformasyon, bilgi ve bilgelik piramidi">
<title>Veri – Enformasyon – Bilgi – Bilgelik (DIKW) piramidi</title>
<rect width="700" height="380" rx="12" fill="#fff" stroke="#e2e8f0"/>
<g font-family="Segoe UI, Arial, Helvetica, sans-serif" text-anchor="middle" fill="#1e293b">
<text x="350" y="30" font-size="17" font-weight="bold">Veriden Bilgeliğe (DIKW Hiyerarşisi)</text>
<polygon points="40,350 360,350 320,280 80,280" fill="#dbeafe" stroke="#2563eb"/>
<polygon points="80,280 320,280 280,210 120,210" fill="#dcfce7" stroke="#16a34a"/>
<polygon points="120,210 280,210 240,140 160,140" fill="#ffedd5" stroke="#ea580c"/>
<polygon points="160,140 240,140 200,70" fill="#fee2e2" stroke="#dc2626"/>
<text x="200" y="320" font-size="15" font-weight="bold">Veri (Data)</text>
<text x="200" y="250" font-size="14" font-weight="bold">Enformasyon</text>
<text x="200" y="182" font-size="14" font-weight="bold">Bilgi</text>
<text x="200" y="128" font-size="12" font-weight="bold">Bilgelik</text>
<g text-anchor="start" font-size="12.5">
<text x="380" y="310">Ölçülmüş, kaydedilmiş ham değerler.</text><text x="380" y="327" fill="#64748b">"3.1 kg", "Mart", "Çorlu"</text>
<text x="380" y="240">Düzenlenmiş, özetlenmiş, bağlamı olan veri.</text><text x="380" y="257" fill="#64748b">"Çorlu'da Mart'ta doğanların ortalaması 3.1 kg"</text>
<text x="380" y="170">Örüntü/ilişki: neden–nasıl sorusuna cevap.</text><text x="380" y="187" fill="#64748b">"Annenin beslenmesi doğum kilosunu etkiliyor"</text>
<text x="380" y="105">Bilgiye dayanarak doğru karar vermek.</text><text x="380" y="122" fill="#64748b">"Hamilelere beslenme programı başlatalım"</text>
</g>
<text x="630" y="345" font-size="11" fill="#64748b">Anlam ve değer ↑</text>
</g></svg>

<line x1="122" y1="152" x2="175" y2="126" stroke="#1e293b" stroke-width="2" marker-end="url(#o)"/>
<rect x="180" y="92" width="100" height="50" rx="8" fill="#f1f5f9" stroke="#64748b"/><text x="230" y="122">Program</text>
<line x1="282" y1="117" x2="318" y2="117" stroke="#1e293b" stroke-width="2" marker-end="url(#o)"/>
<rect x="322" y="95" width="60" height="44" rx="8" fill="#dcfce7" stroke="#16a34a"/><text x="352" y="122">Cevap</text>
<line x1="390" y1="20" x2="390" y2="250" stroke="#e2e8f0" stroke-width="2"/>
<text x="575" y="32" font-size="16" font-weight="bold">Makine Öğrenmesi</text>
<rect x="410" y="60" width="100" height="44" rx="8" fill="#dbeafe" stroke="#2563eb"/><text x="460" y="87">Veri</text>
<rect x="410" y="130" width="100" height="44" rx="8" fill="#dcfce7" stroke="#16a34a"/><text x="460" y="150">Cevaplar</text><text x="460" y="166" font-size="11">(etiketler)</text>
<line x1="512" y1="82" x2="565" y2="110" stroke="#1e293b" stroke-width="2" marker-end="url(#o)"/>
<line x1="512" y1="152" x2="565" y2="126" stroke="#1e293b" stroke-width="2" marker-end="url(#o)"/>
<rect x="570" y="92" width="80" height="50" rx="8" fill="#f1f5f9" stroke="#64748b"/><text x="610" y="115">Öğrenme</text><text x="610" y="131" font-size="11">algoritması</text>
<line x1="652" y1="117" x2="668" y2="117" stroke="#1e293b" stroke-width="2" marker-end="url(#o)"/>
<rect x="672" y="95" width="74" height="44" rx="8" fill="#fef3c7" stroke="#d97706"/><text x="709" y="116">Kurallar</text><text x="709" y="131" font-size="11">(model)</text>
<text x="190" y="215" font-size="12" fill="#64748b">Örn: "Sıcaklık &gt; 38 ise ateş var" kuralını insan yazar.</text>
<text x="575" y="215" font-size="12" fill="#64748b">Örn: Binlerce etiketli e-postadan "spam" kuralını</text>
<text x="575" y="232" font-size="12" fill="#64748b">bilgisayar kendisi çıkarır.</text>

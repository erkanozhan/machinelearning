<svg xmlns="http://www.w3.org/2000/svg" width="760" height="270" viewBox="0 0 760 270" role="img" aria-label="Klasik programlama ve makine öğrenmesi karşılaştırması">
<title>Klasik programlama ve makine öğrenmesi</title>
<defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/></marker></defs>
<rect width="760" height="270" rx="12" fill="#fff" stroke="#e2e8f0"/>
<g font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#1e293b">
<text x="190" y="32" font-size="16" font-weight="bold">Klasik Programlama</text>
<rect x="20" y="60" width="100" height="44" rx="8" fill="#dbeafe" stroke="#2563eb"/><text x="70" y="87">Veri</text>
<rect x="20" y="130" width="100" height="44" rx="8" fill="#fef3c7" stroke="#d97706"/><text x="70" y="150">Kurallar</text><text x="70" y="166" font-size="11">(programcı yazar)</text>

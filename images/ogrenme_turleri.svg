<svg xmlns="http://www.w3.org/2000/svg" width="950" height="330" viewBox="0 0 950 330" role="img" aria-label="Denetimli, denetimsiz ve pekiştirmeli öğrenme">
<title>Öğrenme türleri</title>
<defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/></marker></defs>
<rect width="950" height="330" rx="12" fill="#fff" stroke="#e2e8f0"/>
<g font-family="Segoe UI, Arial, Helvetica, sans-serif" text-anchor="middle" fill="#1e293b">
<text x="160" y="34" font-size="16" font-weight="bold" fill="#2563eb">Denetimli (Supervised)</text>
<rect x="30" y="50" width="260" height="200" fill="#f8fafc" stroke="#e2e8f0"/>
<g fill="#2563eb"><circle cx="70" cy="90" r="6"/><circle cx="100" cy="120" r="6"/><circle cx="60" cy="150" r="6"/><circle cx="120" cy="80" r="6"/><circle cx="90" cy="190" r="6"/><circle cx="140" cy="140" r="6"/></g>
<g fill="#ea580c"><rect x="190" y="100" width="12" height="12"/><rect x="230" y="150" width="12" height="12"/><rect x="200" y="200" width="12" height="12"/><rect x="250" y="90" width="12" height="12"/><rect x="170" y="215" width="12" height="12"/><rect x="255" y="210" width="12" height="12"/></g>
<line x1="130" y1="245" x2="200" y2="55" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 4"/>
<text x="160" y="275" font-size="12.5">Etiketli veri: her örneğin doğru cevabı var.</text>
<text x="160" y="293" font-size="12.5">Görev: sınıflandırma / regresyon</text>
<text x="160" y="313" font-size="11.5" fill="#64748b">Örn: spam tespiti, ev fiyatı tahmini</text>
<text x="465" y="34" font-size="16" font-weight="bold" fill="#16a34a">Denetimsiz (Unsupervised)</text>
<rect x="335" y="50" width="260" height="200" fill="#f8fafc" stroke="#e2e8f0"/>
<ellipse cx="400" cy="110" rx="45" ry="38" fill="#2563eb" fill-opacity="0.08" stroke="#2563eb" stroke-dasharray="5 4"/>
<ellipse cx="530" cy="110" rx="42" ry="36" fill="#16a34a" fill-opacity="0.08" stroke="#16a34a" stroke-dasharray="5 4"/>
<ellipse cx="465" cy="200" rx="48" ry="34" fill="#ea580c" fill-opacity="0.08" stroke="#ea580c" stroke-dasharray="5 4"/>
<g fill="#64748b"><circle cx="385" cy="100" r="5"/><circle cx="410" cy="95" r="5"/><circle cx="395" cy="125" r="5"/><circle cx="420" cy="118" r="5"/><circle cx="520" cy="100" r="5"/><circle cx="545" cy="112" r="5"/><circle cx="525" cy="128" r="5"/><circle cx="540" cy="92" r="5"/><circle cx="450" cy="195" r="5"/><circle cx="478" cy="205" r="5"/><circle cx="462" cy="215" r="5"/><circle cx="485" cy="188" r="5"/></g>
<text x="465" y="275" font-size="12.5">Etiketsiz veri: doğru cevap yok.</text>
<text x="465" y="293" font-size="12.5">Görev: kümeleme, birliktelik, boyut azaltma</text>
<text x="465" y="313" font-size="11.5" fill="#64748b">Örn: müşteri segmentasyonu, sepet analizi</text>
<text x="770" y="34" font-size="16" font-weight="bold" fill="#7c3aed">Pekiştirmeli (Reinforcement)</text>
<rect x="640" y="50" width="260" height="200" fill="#f8fafc" stroke="#e2e8f0"/>
<rect x="705" y="70" width="130" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed"/><text x="770" y="97" font-weight="bold">Ajan (Agent)</text>
<rect x="705" y="185" width="130" height="44" rx="8" fill="#e0f2fe" stroke="#0891b2"/><text x="770" y="212" font-weight="bold">Ortam</text>
<path d="M838,92 C885,110 885,190 838,205" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#o)"/>
<text x="884" y="152" font-size="12" text-anchor="start">Eylem</text>
<path d="M702,207 C655,190 655,110 702,95" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#o)"/>
<text x="652" y="145" font-size="11.5" text-anchor="end">Durum</text><text x="652" y="160" font-size="11.5" text-anchor="end">+ Ödül</text>
<text x="770" y="275" font-size="12.5">Deneme-yanılma ile toplam ödülü artırır.</text>
<text x="770" y="293" font-size="12.5">Görev: sıralı karar verme</text>
<text x="770" y="313" font-size="11.5" fill="#64748b">Örn: oyun oynayan yapay zekâ, robot kontrolü</text>
</g></svg>

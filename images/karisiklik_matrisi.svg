<svg xmlns="http://www.w3.org/2000/svg" width="620" height="400" viewBox="0 0 620 400" role="img" aria-label="Karışıklık matrisi">
<title>Karışıklık matrisi (Confusion Matrix)</title>
<rect width="620" height="400" rx="12" fill="#fff" stroke="#e2e8f0"/>
<g font-family="Segoe UI, Arial, Helvetica, sans-serif" text-anchor="middle" fill="#1e293b">
<text x="310" y="30" font-size="17" font-weight="bold">Karışıklık Matrisi (Confusion Matrix)</text>
<text x="370" y="62" font-size="14" font-weight="bold">TAHMİN EDİLEN SINIF</text>
<text x="275" y="88" font-size="14">Pozitif (1)</text><text x="465" y="88" font-size="14">Negatif (0)</text>
<text x="40" y="215" font-size="14" font-weight="bold" transform="rotate(-90 40 215)">GERÇEK SINIF</text>
<text x="118" y="162" font-size="14">Pozitif (1)</text><text x="118" y="277" font-size="14">Negatif (0)</text>
<rect x="180" y="100" width="190" height="115" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<rect x="370" y="100" width="190" height="115" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<rect x="180" y="215" width="190" height="115" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<rect x="370" y="215" width="190" height="115" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="275" y="148" font-size="22" font-weight="bold" fill="#166534">TP</text><text x="275" y="170" font-size="12.5">Gerçek Pozitif</text><text x="275" y="190" font-size="11.5" fill="#475569">Hastaya "hasta" dedik ✓</text>
<text x="465" y="148" font-size="22" font-weight="bold" fill="#991b1b">FN</text><text x="465" y="170" font-size="12.5">Sahte Negatif (Tip II hata)</text><text x="465" y="190" font-size="11.5" fill="#475569">Hastaya "sağlam" dedik ✗</text>
<text x="275" y="263" font-size="22" font-weight="bold" fill="#9a3412">FP</text><text x="275" y="285" font-size="12.5">Sahte Pozitif (Tip I hata)</text><text x="275" y="305" font-size="11.5" fill="#475569">Sağlama "hasta" dedik ✗</text>
<text x="465" y="263" font-size="22" font-weight="bold" fill="#166534">TN</text><text x="465" y="285" font-size="12.5">Gerçek Negatif</text><text x="465" y="305" font-size="11.5" fill="#475569">Sağlama "sağlam" dedik ✓</text>
<text x="310" y="358" font-size="12.5" fill="#475569">Köşegen (yeşil) = doğru tahminler.  Recall = TP/(TP+FN) → satır,  Precision = TP/(TP+FP) → sütun</text>
<text x="310" y="380" font-size="11.5" fill="#64748b">Not: Weka ve scikit-learn çıktılarında satır/sütun sırası farklı olabilir; önce etiketleri kontrol edin.</text>
</g></svg>

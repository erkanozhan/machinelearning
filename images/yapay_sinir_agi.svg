<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="Yapay nöron ve çok katmanlı yapay sinir ağı">
<title>Yapay nöron ve çok katmanlı algılayıcı (MLP)</title>
<defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/></marker></defs>
<rect width="900" height="360" rx="12" fill="#fff" stroke="#e2e8f0"/>
<g font-family="Segoe UI, Arial, Helvetica, sans-serif" text-anchor="middle" fill="#1e293b">
<text x="200" y="32" font-size="16" font-weight="bold">1) Tek bir yapay nöron (algılayıcı)</text>
<g font-size="14">
<circle cx="50" cy="90" r="20" fill="#dbeafe" stroke="#2563eb"/><text x="50" y="95">x₁</text>
<circle cx="50" cy="160" r="20" fill="#dbeafe" stroke="#2563eb"/><text x="50" y="165">x₂</text>
<circle cx="50" cy="230" r="20" fill="#dbeafe" stroke="#2563eb"/><text x="50" y="235">x₃</text>
<circle cx="50" cy="295" r="16" fill="#f1f5f9" stroke="#64748b"/><text x="50" y="300">1</text>
<g stroke="#1e293b" stroke-width="1.6"><line x1="70" y1="95" x2="182" y2="152" marker-end="url(#o)"/><line x1="70" y1="160" x2="180" y2="160" marker-end="url(#o)"/><line x1="70" y1="225" x2="182" y2="168" marker-end="url(#o)"/><line x1="66" y1="290" x2="186" y2="176" marker-end="url(#o)"/></g>
<text x="120" y="112" font-size="13" fill="#dc2626">w₁</text><text x="120" y="153" font-size="13" fill="#dc2626">w₂</text><text x="115" y="208" font-size="13" fill="#dc2626">w₃</text><text x="115" y="262" font-size="13" fill="#dc2626">b</text>
<circle cx="215" cy="160" r="32" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="215" y="155" font-size="15">Σ</text><text x="215" y="176" font-size="12">z</text>
<line x1="248" y1="160" x2="282" y2="160" stroke="#1e293b" stroke-width="1.6" marker-end="url(#o)"/>
<rect x="285" y="135" width="60" height="50" rx="8" fill="#ede9fe" stroke="#7c3aed"/><text x="315" y="165">f(z)</text>
<line x1="347" y1="160" x2="378" y2="160" stroke="#1e293b" stroke-width="1.6" marker-end="url(#o)"/><text x="385" y="165" text-anchor="start">ŷ</text>
</g>
<text x="200" y="330" font-size="13">z = w₁x₁ + w₂x₂ + w₃x₃ + b ,   ŷ = f(z)</text>
<text x="200" y="348" font-size="11.5" fill="#64748b">f: aktivasyon fonksiyonu (sigmoid, ReLU, tanh ...)</text>
<line x1="420" y1="20" x2="420" y2="340" stroke="#e2e8f0" stroke-width="2"/>
<text x="660" y="32" font-size="16" font-weight="bold">2) Çok katmanlı ağ (MLP)</text>
<g stroke="#94a3b8" stroke-width="1">
<line x1="490" y1="100" x2="640" y2="80"/><line x1="490" y1="100" x2="640" y2="150"/><line x1="490" y1="100" x2="640" y2="220"/><line x1="490" y1="100" x2="640" y2="290"/>
<line x1="490" y1="170" x2="640" y2="80"/><line x1="490" y1="170" x2="640" y2="150"/><line x1="490" y1="170" x2="640" y2="220"/><line x1="490" y1="170" x2="640" y2="290"/>
<line x1="490" y1="240" x2="640" y2="80"/><line x1="490" y1="240" x2="640" y2="150"/><line x1="490" y1="240" x2="640" y2="220"/><line x1="490" y1="240" x2="640" y2="290"/>
<line x1="640" y1="80" x2="800" y2="130"/><line x1="640" y1="150" x2="800" y2="130"/><line x1="640" y1="220" x2="800" y2="130"/><line x1="640" y1="290" x2="800" y2="130"/>
<line x1="640" y1="80" x2="800" y2="210"/><line x1="640" y1="150" x2="800" y2="210"/><line x1="640" y1="220" x2="800" y2="210"/><line x1="640" y1="290" x2="800" y2="210"/></g>
<g stroke-width="2"><circle cx="490" cy="100" r="17" fill="#dbeafe" stroke="#2563eb"/><circle cx="490" cy="170" r="17" fill="#dbeafe" stroke="#2563eb"/><circle cx="490" cy="240" r="17" fill="#dbeafe" stroke="#2563eb"/>
<circle cx="640" cy="80" r="17" fill="#ffedd5" stroke="#ea580c"/><circle cx="640" cy="150" r="17" fill="#ffedd5" stroke="#ea580c"/><circle cx="640" cy="220" r="17" fill="#ffedd5" stroke="#ea580c"/><circle cx="640" cy="290" r="17" fill="#ffedd5" stroke="#ea580c"/>
<circle cx="800" cy="130" r="17" fill="#dcfce7" stroke="#16a34a"/><circle cx="800" cy="210" r="17" fill="#dcfce7" stroke="#16a34a"/></g>
<g font-size="13" font-weight="bold"><text x="490" y="290" fill="#2563eb">Girdi</text><text x="490" y="306" fill="#2563eb">katmanı</text>
<text x="640" y="330" fill="#ea580c">Gizli katman</text><text x="800" y="260" fill="#16a34a">Çıktı</text><text x="800" y="276" fill="#16a34a">katmanı</text></g>
<text x="660" y="352" font-size="11.5" fill="#64748b">Eğitim: tahmin hatası geriye yayılarak (backpropagation) ağırlıklar gradyan inişiyle güncellenir.</text>
</g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-label="Yapay zekâ, makine öğrenmesi ve derin öğrenme ilişkisi">
<title>Yapay zekâ, makine öğrenmesi ve derin öğrenme ilişkisi</title>
<rect width="640" height="400" rx="12" fill="#fff" stroke="#e2e8f0"/>
<g font-family="Segoe UI, Arial, Helvetica, sans-serif" text-anchor="middle">
<ellipse cx="320" cy="210" rx="300" ry="175" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<ellipse cx="350" cy="235" rx="225" ry="135" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<ellipse cx="380" cy="262" rx="150" ry="95" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<ellipse cx="405" cy="285" rx="80" ry="52" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="320" y="56" font-size="18" font-weight="bold" fill="#1e40af">Yapay Zekâ (AI)</text>
<text x="320" y="73" font-size="11.5" fill="#334155">İnsan zekâsı gerektiren işleri yapan tüm sistemler</text>
<text x="320" y="88" font-size="11.5" fill="#334155">(kurala dayalı uzman sistemler dahil)</text>
<text x="300" y="140" font-size="17" font-weight="bold" fill="#166534">Makine Öğrenmesi (ML)</text>
<text x="300" y="158" font-size="12" fill="#334155">Kuralları veriden öğrenen yöntemler</text>
<text x="330" y="200" font-size="15" font-weight="bold" fill="#9a3412">Yapay Sinir Ağları</text>
<text x="405" y="282" font-size="15" font-weight="bold" fill="#991b1b">Derin Öğrenme</text>
<text x="405" y="300" font-size="11" fill="#334155">Çok katmanlı sinir ağları</text>
</g></svg>
